<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表紙の比較：紙色／藍色</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: #e4e3df; font-family: 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif; }
header { max-width: 1280px; margin: 0 auto; padding: 24px 28px 8px; color: #26262e; }
header p { margin: 8px 0 0; font-size: 14px; }
header a { color: #1f2b47; }
.preview { margin: 24px auto 48px; width: min(1280px, 96vw); }
.label { margin: 0 0 10px; color: #34343b; font-size: 16px; font-weight: 600; }
.frame { width: 100%; aspect-ratio: 16/9; overflow: hidden; }
.cover { position: relative; width: 1280px; height: 720px; overflow: hidden; transform-origin: top left; background: #f6f4ee; color: #1f2b47; }
.cover h1 { position: absolute; left: 86px; top: 196px; margin: 0; font-family: 'Yu Mincho', 'YuMincho', 'Noto Serif CJK JP', serif; font-weight: 700; font-size: 80px; line-height: 1.32; letter-spacing: .012em; }
.cover h1 span { display: block; white-space: nowrap; }
.cover img { position: absolute; width: 530px; height: 530px; object-fit: contain; left: 706px; top: 148px; }
.cover.indigo { background: #1f2b47; color: #f6f4ee; }
@page { size: 1280px 720px; margin: 0; }
@media print {
body { background: transparent; }
header, .label { display: none; }
.preview { width: 1280px; margin: 0; break-after: page; }
.preview:last-child { break-after: auto; }
.frame { width: 1280px; height: 720px; }
.cover { transform: none !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>
<header><strong>表紙の比較</strong><p>主題と挿絵をそろえ、背景色を比較。<a href="cover-study.pdf">2案の PDF</a></p></header>
<main>
<div class="preview"><p class="label">A · 紙色</p><div class="frame"><section class="cover" aria-label="表紙案 A、紙色の背景">
<h1><span>AI との開発に</span><span>スクラムを</span><span>取り入れる</span></h1>
<img src="scene.png" alt="計画を確認するレナ1人と、ノートパソコンで作業する2人の AI 開発者。淡い水彩調のデフォルメした人物。">
</section></div></div>
<div class="preview"><p class="label">B · 藍色</p><div class="frame"><section class="cover indigo" aria-label="表紙案 B、藍色の背景">
<h1><span>AI との開発に</span><span>スクラムを</span><span>取り入れる</span></h1>
<img src="scene.png" alt="計画を確認するレナ1人と、ノートパソコンで作業する2人の AI 開発者。淡い水彩調のデフォルメした人物。">
</section></div></div>
</main>
<script>
function resize(){ document.querySelectorAll('.frame').forEach(f=>f.firstElementChild.style.transform=`scale(${f.clientWidth / 1280})`); }
addEventListener('resize',resize); resize();
</script>
</body>
</html>
