name: Slides CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: 原稿・リンク・ガイド同期・HTML・PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 日本語フォントを用意
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run check
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - name: デザイン見本（slides/samples）の HTML・PDF
        run: npm run build:samples
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: dist/
          if-no-files-found: error
